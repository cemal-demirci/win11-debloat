name: release

# Publish a release: either push a tag like v1.0.0, or run this workflow from
# the Actions tab ("Run workflow") and type the version; the tag is then
# created by the workflow itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, e.g. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: pwsh
        run: dotnet build app/Win11Debloat.csproj -c Release "-p:Version=$($env:TAG.TrimStart('v'))"
      - name: Smoke test (headless preview)
        shell: pwsh
        run: |
          $p = Start-Process app/bin/Release/net48/Win11-Debloat.exe -ArgumentList '--run', "$env:RUNNER_TEMP\preview.log", 'preview' -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\preview.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/bin/Release/net48/Win11-Debloat.exe, Win11-Debloat.ps1, Win11-Restore.ps1 dist/
          Get-ChildItem dist | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist).FullName --target $env:GITHUB_SHA `
            --title "Windows 11 Debloat $env:TAG" --notes-file .github/release-notes.md
          "::notice title=Release::Published $env:TAG with $((Get-ChildItem dist).Name -join ', ')"
