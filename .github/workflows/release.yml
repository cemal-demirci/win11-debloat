name: release

# Push a tag like v1.0.0 to build the app and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: pwsh
        run: dotnet build app/Win11Debloat.csproj -c Release "-p:Version=$('${{ github.ref_name }}'.TrimStart('v'))"
      - name: Smoke test (headless preview)
        shell: pwsh
        run: |
          $p = Start-Process app/bin/Release/net48/Win11-Debloat.exe -ArgumentList '--run', "$env:RUNNER_TEMP\preview.log", 'preview' -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\preview.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/bin/Release/net48/Win11-Debloat.exe, Win11-Debloat.ps1, Win11-Restore.ps1 dist/
          Get-ChildItem dist | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName --title "Windows 11 Debloat ${{ github.ref_name }}" --notes-file .github/release-notes.md
