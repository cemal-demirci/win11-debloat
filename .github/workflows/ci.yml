name: denetim

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Parse + PSScriptAnalyzer (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | Format-List; throw "parse errors in $($f.Name)" }
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning -ExcludeRule `
                 PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions, PSUseSingularNouns, PSAvoidUsingEmptyCatchBlock
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  roundtrip:
    name: Scripts - debloat + restore round trip (Windows Server 2025)
    needs: lint
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\ci-roundtrip.ps1

  app:
    name: App - build, headless runs, UI test (Windows Server 2025)
    needs: lint
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Build Win11-Debloat.exe
        run: dotnet build app/Win11Debloat.csproj -c Release
      - name: Embedded scripts, 64-bit PowerShell, preview / apply / restore through the app
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\ci-app.ps1 -Exe app\bin\Release\net48\Win11-Debloat.exe
      - name: Window test (UI Automation)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\ci-app-ui.ps1 -Exe app\bin\Release\net48\Win11-Debloat.exe
      - uses: actions/upload-artifact@v6
        with:
          name: Win11-Debloat
          path: app/bin/Release/net48/Win11-Debloat.exe
